<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>บันทึกเติมน้ำมัน — น้องเต็มถัง</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <header class="tt-header">
    <h1>⛽ บันทึกเติมน้ำมัน</h1>
    <p id="user-name">กำลังโหลด...</p>
  </header>

  <main class="tt-main">
    <form id="refuel-form" class="tt-card tt-card--fuel" data-category="LIQUID">
      <div class="tt-form-group">
        <label for="vehicle_id">เลือกรถ</label>
        <select id="vehicle_id" name="vehicle_id" required>
          <option value="">-- เลือกรถ --</option>
        </select>
        <div class="tt-field-error" data-error="vehicle_id" hidden></div>
      </div>

      <div class="tt-form-group">
        <label for="odometer">เลขไมล์ (km)</label>
        <input type="number" id="odometer" name="odometer" inputmode="numeric" min="0" step="1" required placeholder="เช่น 46850">
        <div class="tt-field-error" data-error="odometer" hidden></div>
      </div>

      <div class="tt-form-group">
        <label for="quantity" id="quantity-label">จำนวน (ลิตร)</label>
        <input type="number" id="quantity" name="quantity" inputmode="decimal" min="0" step="0.01" required placeholder="0.00">
        <div class="tt-field-error" data-error="quantity" hidden></div>
      </div>

      <div class="tt-form-group">
        <label for="price_per_unit" id="price-label">ราคาต่อลิตร (บาท)</label>
        <input type="number" id="price_per_unit" name="price_per_unit" inputmode="decimal" min="0" step="0.01" required placeholder="0.00">
        <div class="tt-field-error" data-error="price_per_unit" hidden></div>
      </div>

      <div class="tt-form-group">
        <label for="total_price">ยอดรวม (บาท)</label>
        <input type="number" id="total_price" name="total_price" inputmode="decimal" min="0" step="0.01" required placeholder="คำนวณอัตโนมัติ">
        <div class="tt-field-error" data-error="total_price" hidden></div>
      </div>

      <details class="tt-details">
        <summary class="tt-details__summary">เพิ่มเติม (ไม่บังคับ)</summary>
        <div class="tt-details__body">
          <div class="tt-form-group">
            <label for="date">วันที่เติม</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="tt-form-group">
            <label for="station">ปั๊ม / สถานีชาร์จ</label>
            <input type="text" id="station" name="station" placeholder="เช่น ปตท. สุขุมวิท" autocomplete="off">
          </div>
          <div class="tt-form-group" style="margin-bottom:0">
            <label class="tt-checkbox">
              <input type="checkbox" id="is_full_tank" name="is_full_tank" checked>
              <span id="full-tank-label">เติมเต็มถัง</span>
            </label>
          </div>
        </div>
      </details>

      <button type="submit" class="tt-btn tt-btn--primary">บันทึก</button>
    </form>
  </main>

  <script src="../shared/config.js?v=5"></script>
  <script src="../shared/api.js?v=5"></script>
  <script src="../shared/validate.js?v=5"></script>
  <script src="../shared/ui.js?v=5"></script>
  <script src="../shared/liff.js?v=5"></script>
  <script>
    const LAST_VEHICLE_KEY = "tt_last_vehicle_id";
    let vehicles = [];
    let previousOdometer = null;
    let currentCategory = "LIQUID";

    async function boot() {
      try {
        TemThangUI.showLoading("กำลังเข้าสู่ระบบ...");
        const profile = await TemThangLiff.init(TEMTHANG_CONFIG.LIFF_IDS.refuel);
        if (!profile) {
          document.getElementById("user-name").textContent = "กำลังเข้าสู่ระบบ...";
          return;
        }
        document.getElementById("user-name").textContent = profile.displayName;
        document.getElementById("date").valueAsDate = new Date();
        TemThangUI.hideLoading();

        TemThangUI.showLoading("กำลังโหลดรายการรถ...");
        await loadVehicles();
      } catch (e) {
        document.getElementById("user-name").textContent = "โหลดไม่สำเร็จ";
        TemThangUI.showFatal(e.message);
      } finally {
        TemThangUI.hideLoading();
      }
    }

    function applyVehicleSelection(vehicleId) {
      const select = document.getElementById("vehicle_id");
      select.value = vehicleId || "";
      const opt = select.selectedOptions[0];
      if (!opt?.dataset.category) return;
      updateLabels(opt.dataset.category);
      previousOdometer = opt.dataset.odometer ? Number(opt.dataset.odometer) : null;
    }

    async function loadVehicles() {
      vehicles = await TemThangApi.getVehicles();
      const select = document.getElementById("vehicle_id");
      select.innerHTML = '<option value="">-- เลือกรถ --</option>';
      vehicles.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v.vehicle_id;
        opt.textContent = `${v.name} (${v.license_plate || "ไม่มีทะเบียน"})`;
        opt.dataset.category = v.fuel_category;
        opt.dataset.odometer = v.odometer_latest || "";
        select.appendChild(opt);
      });

      const lastId = localStorage.getItem(LAST_VEHICLE_KEY);
      const defaultId = lastId && vehicles.some((v) => v.vehicle_id === lastId)
        ? lastId
        : vehicles[0]?.vehicle_id;
      if (defaultId) applyVehicleSelection(defaultId);
    }

    function updateLabels(category) {
      currentCategory = category;
      TemThangUI.setFuelTheme(category);
      document.getElementById("refuel-form").dataset.category = category;

      const units = { LIQUID: "ลิตร", GAS: "กก.", ELECTRIC: "kWh" };
      const unit = units[category] || "ลิตร";
      document.getElementById("quantity-label").textContent = `จำนวน (${unit})`;
      document.getElementById("price-label").textContent = `ราคาต่อ${unit} (บาท)`;
      document.getElementById("full-tank-label").textContent =
        category === "ELECTRIC" ? "ชาร์จเต็ม (ถึง target SOC)" : "เติมเต็มถัง";
    }

    document.getElementById("vehicle_id").addEventListener("change", (e) => {
      applyVehicleSelection(e.target.value);
    });

    document.getElementById("quantity").addEventListener("input", calcTotal);
    document.getElementById("price_per_unit").addEventListener("input", calcTotal);

    function calcTotal() {
      const q = Number(document.getElementById("quantity").value);
      const p = Number(document.getElementById("price_per_unit").value);
      if (q > 0 && p > 0) {
        document.getElementById("total_price").value = (q * p).toFixed(2);
      }
    }

    TemThangUI.bindSubmitButton(document.getElementById("refuel-form"), async (formData) => {
      const vehicleId = formData.get("vehicle_id");
      const vehicle = vehicles.find((v) => v.vehicle_id === vehicleId);

      const payload = {
        vehicle_id: vehicleId,
        date: formData.get("date"),
        station: formData.get("station"),
        fuel_type: vehicle?.fuel_type,
        fuel_category: vehicle?.fuel_category || currentCategory,
        quantity: Number(formData.get("quantity")),
        price_per_unit: Number(formData.get("price_per_unit")),
        total_price: Number(formData.get("total_price")),
        odometer: Number(formData.get("odometer")),
        is_full_tank: document.getElementById("is_full_tank").checked,
      };

      const result = TemThangValidate.validateRefuelForm(payload, previousOdometer);
      if (!result.valid) {
        TemThangUI.renderFieldErrors(result.errors);
        return;
      }

      await TemThangApi.saveLog(payload);
      localStorage.setItem(LAST_VEHICLE_KEY, vehicleId);
      await TemThangUI.showSuccessCheckmark("บันทึกสำเร็จ");
      TemThangLiff.close();
      return { keepDisabled: true };
    });

    boot();
  </script>
</body>
</html>
